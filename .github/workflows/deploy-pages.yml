name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: pwsh
        run: |
          ./build-all.ps1
          New-Item -ItemType Directory -Path dist | Out-Null
          $excludeNames = @(
            "dist", ".git", "preview-server.ps1", "export-all-source.ps1",
            "deploy.ps1", "build-all.ps1", "build-single.ps1",
            "deploy.config.json", "ALL-SOURCE-CODE.txt", "_terms-body.html"
          )
          Get-ChildItem -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($PWD.Path.Length + 1).Replace("\", "/")
            if ($rel.StartsWith("dist/")) { return }
            $name = Split-Path $rel -Leaf
            if ($excludeNames -contains $name) { return }
            if ($name -like "*-single.html") { return }
            $dest = Join-Path "dist" $rel
            $destDir = Split-Path $dest -Parent
            if ($destDir -and -not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            Copy-Item $_.FullName $dest -Force
          }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
